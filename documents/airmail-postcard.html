 font-size: 23px; font-weight: 400; line-height: 1.5; margin: 0 0 16px; padding: 0; padding-bottom: 16px; text-align: left; text-indent: 0; width: auto">四边环绕的真实邮笺感</h2><p style="color: #344551; font-size: 16px; line-height: 1.95; margin: 0 0 18px">区别于普通上下装饰条，四面完整的航空斜纹外框赋予整篇游记独一无二的信封轮廓。</p><blockquote style="background-color: #e3e7e6; border: 1px dashed #365d87; color: #344551; font-size: 19px; font-style: italic; line-height: 1.85; margin: 24px 0; padding: 24px; text-align: left"><p style="color: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; margin: 0 0 12px">把远方的风、海浪和街角咖啡香，一并装进航空信封寄给你。</p></blockquote></section><section style="background: transparent; border: 0; box-sizing: border-box; margin: 32px 0 0; margin-bottom: 0; margin-left: 0; margin-right: 0; padding: 16px 0; padding-bottom: 0; padding-top: 0; width: 100%"><h2 style="background: transparent; border: 0; color: #365d87; display: block; font-family: Georgia, &#39;Songti SC&#39;, SimSun, serif; font-size: 23px; font-weight: 400; line-height: 1.5; margin: 0 0 16px; padding: 0; padding-bottom: 16px; text-align: left; text-indent: 0; width: auto">航空邮笺的特色场景</h2><ul style="margin: 0 0 16px; padding-left: 22px"><li style="margin: 0 0 8px; padding-left: 3px">旅行游记、海外生活通讯与城市漫步</li><li style="margin: 0 0 8px; padding-left: 3px">读者来信专栏与周期性 Newsletter</li><li style="margin: 0 0 8px; padding-left: 3px">经典红蓝配色，百搭风景与人文照片</li></ul><p style="border: 0; border-top: 1px solid #627682; color: #365d87; font-size: 16px; font-style: italic; line-height: 1.95; margin: 32px 0 0; padding: 18px 0 0; text-align: right">下一站盖上新邮戳时，再提笔给你写信。</p></section></section></section></body></html>
