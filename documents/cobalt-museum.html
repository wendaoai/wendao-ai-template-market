eight: 400; line-height: 1.85; margin: 24px 0; padding: 26px 20px; text-align: center"><p style="color: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; margin: 0 0 12px">真正有气场的色彩，一块就够了。</p></blockquote><p style="background-color: #f4f2e9; border: 1px solid #5b6c8e; box-sizing: border-box; line-height: 1.8; margin: 24px 0 0; padding: 12px; text-align: left"><img src="../sample-images/minimal-architecture.jpg" alt="光影分明的现代美术馆白色建筑" style="display: block; height: auto; margin: 0; width: 100%"/></p></section><section style="background: transparent; border: 0; box-sizing: border-box; margin: 34px 0 0; margin-bottom: 0; margin-left: 0; margin-right: 0; padding: 18px 0; padding-bottom: 0; padding-top: 0; width: 100%"><h2 style="background: transparent; border: 0; border-bottom: 1px solid #264ba3; color: #264ba3; display: block; font-family: Georgia, &#39;Songti SC&#39;, SimSun, serif; font-size: 25px; font-weight: 400; line-height: 1.5; margin: 0 0 16px; padding: 0; padding-bottom: 16px; text-align: left; text-indent: 0; width: auto">克莱因蓝版式的适用场景</h2><ul style="margin: 0 0 16px; padding-left: 22px"><li style="margin: 0 0 8px; padding-left: 3px">展览导览、品牌视觉升级与设计趋势</li><li style="margin: 0 0 8px; padding-left: 3px">强观点深度专栏与年度发布</li><li style="margin: 0 0 8px; padding-left: 3px">高对比色彩在列表里一眼跳出</li></ul><p style="border: 0; border-top: 1px solid #5b6c8e; color: #263c69; font-size: 16px; line-height: 1.95; margin: 32px 0 0; padding: 18px 0 0; text-align: left">走出展厅，那抹钴蓝仍会停留在记忆深处。</p></section></section></section></body></html>
