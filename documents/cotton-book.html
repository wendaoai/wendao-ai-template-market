<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>棉纸书房</title><style>*{box-sizing:border-box}body{display:flow-root;width:640px;margin:0;background:#ffffff;color:#222222;font:15px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style></head><body><section data-no-dark="" id="cw-layout-magazine" class="cw-reading-rhythm-v3" style="background-color: #f7f3e9; box-sizing: border-box; color: #302c27; font-family: Georgia, &#39;Songti SC&#39;, SimSun, serif; font-size: 16px; line-height: 1.8; margin-left: 0; margin-right: 0; overflow-wrap: anywhere; padding: 26px 24px; width: 100%; word-break: break-word"><section style="box-sizing: border-box; color: #302c27; margin: 0; margin-left: 0; margin-right: 0; max-width: 100%; padding: 0; width: 100%"><p style="background: transparent; border: 0; box-sizing: border-box; color: #302c27; display: block; font-size: 17px; line-height: 2; margin: 0 0 28px; max-width: 100%; padding: 0; text-align: left; width: auto"><span style="color: #804331; display: inline-block; font-size: 42px; line-height: 1; margin-right: 6px">翻</span>开一册印在温润棉纸上的书，首字自然放大沉入行间，没有多余弹窗与标签，文字重新回到书页原本的安静。</p><p style="box-sizing: border-box; line-height: 1.8; margin: 24px 0; text-align: left"><img src="../sample-images/reading-still-life.jpg" alt="阳光木桌上的摊开书页与咖啡杯" style="display: block; height: auto; margin: 0; width: 100%"/></p><section style="border: 0; border-top: 1px solid #ede4d4; box-sizing: border-box; margin: 32px 0 0; margin-left: 0; margin-right: 0; padding: 12px 0 0; width: 100%"><h2 style="background: transparent; border: 0; color: #302c27; display: block; font-family: Georgia, &#39;Songti SC&#39;, SimSun, serif; font-size: 23px; font-weight: 500; line-height: 1.5; margin: 0 0 16px; padding: 12px 0; text-align: center; text-indent: 0; width: auto">像排一本纸质书那样排长文</h2><p style="color: #302c27; font-size: 16px; line-height: 1.95; margin: 0 0 18px">不塞多余的徽章、不套层层外框，全篇依靠舒展宋体、温和棉纸底色与克制细线建立安静的阅读秩序。</p><blockquote style="background: transparent; border: 0; color: #302c27; font-size: 21px; font-style: italic; line-height: 1.85; margin: 24px 0; padding: 20px 14px; text-align: center"><p style="color: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; margin: 0 0 12px">真正耐读的版式，是让人忘了自己在刷手机。</p></blockquote></section><section style="border: 0; border-top: 1px solid #ede4d4; box-sizing: border-box; margin: 32px 0 0; margin-left: 0; margin-right: 0; padding: 12px 0 0; width: 100%"><h2 style="background: transparent; border: 0; color: #302c27; display: block; font-family: Georgia, &#39;Songti SC&#39;, SimSun, serif; font-size: 23px; font-weight: 500; line-height: 1.5; margin: 0 0 16px; padding: 12px 0; text-align: center; text-indent: 0; width: auto">适合安静沉浸的书写时刻</h2><ul style="margin: 0 0 16px; padding-left: 22px"><li style="margin: 0 0 8px; padding-left: 3px">大号宋体首字下沉，自然引入开篇语境</li><li style="margin: 0 0 8px; padding-left: 3px">细横线与居中章节建立古典书籍节奏</li><li style="margin: 0 0 8px; padding-left: 3px">极适合书评、访谈、随笔与文化长文</li></ul><p style="border: 0; border-top: 1px solid #716052; color: #302c27; font-size: 16px; line-height: 1.95; margin: 32px 0 0; padding: 18px 0 0; text-align: left">合上书页之前，愿这一段文字留给你片刻宁静。</p></section></section></section></body></html>
