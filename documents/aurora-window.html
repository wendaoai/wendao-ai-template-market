lor: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; margin: 0 0 12px">有些仰望星空的念头，要在足够深的夜色里才看得清楚。</p></blockquote><p style="box-sizing: border-box; line-height: 1.8; margin: 24px 0 0; text-align: left"><img src="../sample-images/starry-night.jpg" alt="繁星夜空与静谧湖面剪影" style="display: block; height: auto; margin: 0; width: 100%"/></p></section><section style="background: transparent; border: 0; box-sizing: border-box; margin: 36px auto 0; margin-bottom: 0; margin-left: 0; margin-right: 0; padding: 16px 0 0; padding-bottom: 0; padding-top: 0; width: 100%"><h2 style="background: transparent; border: 0; color: #a5e8ca; display: block; font-family: -apple-system, BlinkMacSystemFont, &#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif; font-size: 24px; font-weight: 400; line-height: 1.5; margin: 0 0 16px; padding: 0 0 14px; text-align: center; text-indent: 0; width: auto">极光模板的沉浸体验</h2><ul style="margin: 0 0 16px; padding-left: 22px"><li style="margin: 0 0 8px; padding-left: 3px">深蓝绿极光色盘区别于紫黑赛博与纯黑</li><li style="margin: 0 0 8px; padding-left: 3px">柔和象牙白正文保障暗底长读清晰度</li><li style="margin: 0 0 8px; padding-left: 3px">适合夜读专栏、科幻科普与年度畅想</li></ul><p style="border: 0; border-top: 1px solid #b2c4dc; color: #e4eff7; font-size: 16px; line-height: 1.95; margin: 32px 0 0; padding: 18px 0 0; text-align: left">抬头看一眼远方的光，明天继续轻装出发。</p></section></section></section></body></html>
