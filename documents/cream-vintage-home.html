<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>奶油中古</title><style>*{box-sizing:border-box}body{display:flow-root;width:640px;margin:0;background:#ffffff;color:#222222;font:15px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style></head><body><section style="box-sizing: border-box; width: 100%; max-width: 677px; margin: 0 auto; padding: 24px 12px; background-color: #f7f3ed; color: #222222; font-family: Optima-Regular,&#34;PingFang SC&#34;,&#34;Microsoft YaHei&#34;,sans-serif; font-size: 13px; line-height: 1.75; overflow-wrap: anywhere" data-no-dark="" id="cw-layout-imported"><section data-no-dark=""><section style="margin: 0 8px 28px"><p style="color: #222222; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; line-height: 1.75; margin: 0 0 22px; text-align: center">空间的温度来自光线、材质与恰到好处的留白，好版式亦是如此。</p></section><section style="margin: 20px 0"><img src="../sample-images/reading-still-life.jpg" alt="阳光书桌与笔记本咖啡" style="display: block; height: auto; margin: 0; max-width: 100%; vertical-align: middle; width: 100%"/></section><section style="margin: 32px 0 0"><section style="display: table; width: 100%; table-layout: fixed; border-bottom: 1px solid #222222; padding-bottom: 11px; margin-bottom: 20px"><section style="display: table-cell; width: 60px; vertical-align: middle"><span style="display: inline-block; border: 1px solid #222222; border-radius: 50%; padding: 0 10px; font-size: 18px; font-weight: 700; line-height: 24px; letter-spacing: 0">01</span></section><h2 style="display: table-cell; vertical-align: middle; margin: 0; padding: 0 7px 0 0; text-align: right; color: #222222; font-size: 18px; font-weight: 700; line-height: 24px; letter-spacing: 0; overflow-wrap: anywhere">从空间尺度建立阅读秩序</h2></section><section><section><p style="color: #222222; font-size: 13px; letter-spacing: 1.5px; line-height: 1.75; margin: 0 8px 24px; text-align: justify">暖米纸底托起文字，椭圆编号与右齐粗线让每一节像一本法式家居画册。</p></section><section style="margin: 24px 8px; padding: 12px 10px; background-color: #f3efe9" data-no-dark=""><blockquote style="border: 0; margin: 0; padding: 0"><p style="color: #444444; font-size: 13px; letter-spacing: 1.5px; line-height: 1.75; margin: 0; text-align: justify">少一点堆砌的色块，多留一寸呼吸的空间。</p></blockquote></section></section></section><section style="margin: 32px 0 0"><section style="display: table; width: 100%; table-layout: fixed; border-bottom: 1px solid #222222; padding-bottom: 11px; margin-bottom: 20px"><section style="display: table-cell; width: 60px; vertical-align: middle"><span style="display: inline-block; border: 1px solid #222222; border-radius: 50%; padding: 0 10px; font-size: 18px; font-weight: 700; line-height: 24px; letter-spacing: 0">02</span></section><h2 style="display: table-cell; vertical-align: middle; margin: 0; padding: 0 7px 0 0; text-align: right; color: #222222; font-size: 18px; font-weight: 700; line-height: 24px; letter-spacing: 0; overflow-wrap: anywhere">细节里的松弛与克制</h2></section><section><section style="margin: 20px 8px"><ul style="color: #222222; font-size: 13px; letter-spacing: 1px; line-height: 1.75; list-style-type: disc; margin: 0; padding-left: 22px"><li style="margin: 0 0 12px">居中粗体导语先定下温柔基调</li><li style="margin: 0 0 12px">左圆标右齐标题自带杂志辨识度</li><li style="margin: 0 0 12px">暖米底面全幅柔和耐读</li></ul></section><section><p style="color: #222222; font-size: 13px; letter-spacing: 1.5px; line-height: 1.75; margin: 0 8px 24px; text-align: justify">好设计不喧宾夺主，只让内容本身自然发光。</p></section></section></section></section></section></body></html>
