<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>月白朱红</title><style>*{box-sizing:border-box}body{display:flow-root;width:640px;margin:0;background:#ffffff;color:#222222;font:15px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style></head><body><section data-no-dark="" style="box-sizing: border-box; width: 100%; padding: 16px; background-color: #ffffff; color: #222222; font-family: -apple-system,BlinkMacSystemFont,&#34;PingFang SC&#34;,&#34;Microsoft YaHei&#34;,sans-serif; font-size: 17px; line-height: 1.75; letter-spacing: 0.5px; overflow-wrap: anywhere"><section><p style="margin: 0 0 24px; color: #222222; font-size: 17px; line-height: 1.75; text-align: justify">去掉多余框线与装饰，只留白纸黑字与一抹朱红数字，让观点自己说话。</p><h2 title="用大号数字撑起整篇节奏" style="margin: 32px 0 24px; color: #bb3326; font-size: 50px; font-weight: 400; line-height: 1.3; letter-spacing: 2px; text-align: center; overflow-wrap: anywhere">01</h2><p style="margin: 0 0 24px; color: #222222; font-size: 17px; line-height: 1.75; text-align: justify">舒展的行距与段距承担阅读节奏，重点句只在关键处加粗一次。当形式退后一步，思考的锋芒就会浮现出来。</p><blockquote style="margin: 24px 0; padding: 0; color: #222222; font-size: 17px; line-height: 1.75"><p style="margin: 0 0 24px; color: #222222; font-size: 17px; line-height: 1.75; text-align: justify">好的长文排版，是让读者忘记排版的存在。</p></blockquote><h2 title="克制留白的耐读法则" style="margin: 32px 0 24px; color: #bb3326; font-size: 50px; font-weight: 400; line-height: 1.3; letter-spacing: 2px; text-align: center; overflow-wrap: anywhere">02</h2><p style="margin: 0 0 24px; color: #222222; font-size: 17px; line-height: 1.75; text-align: justify">无论是深度评论、读书随笔还是年度复盘，纯白底与一抹朱红都能经得起长时间手机端阅读。</p><p style="margin: 0 0 24px; color: #222222; font-size: 17px; line-height: 1.75; text-align: justify"><img src="../sample-images/minimal-architecture.jpg" alt="极简建筑天窗光影" style="display: block; width: 100%; max-width: 100%; height: auto; margin: 24px auto"/></p><p style="margin: 0 0 24px; color: #222222; font-size: 17px; line-height: 1.75; text-align: justify">留下真正值得思考的句子，其余交给留白。</p></section></section></body></html>
