<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>暖纸长信</title><style>*{box-sizing:border-box}body{display:flow-root;width:640px;margin:0;background:#ffffff;color:#222222;font:15px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style></head><body><section data-no-dark="" id="cw-layout-letter" class="cw-reading-rhythm-v3" style="background-color: #fffaf4; box-sizing: border-box; color: #534236; font-family: Georgia, &#39;Songti SC&#39;, SimSun, serif; font-size: 17px; line-height: 1.8; margin-left: 0; margin-right: 0; overflow-wrap: anywhere; padding: 24px; padding-left: 24px; padding-right: 24px; width: 100%; word-break: break-word"><section style="box-sizing: border-box; margin: 0 auto; margin-left: 0; margin-right: 0; max-width: 100%; width: 100%"><section style="border-bottom: 1px solid #9a7250; box-sizing: border-box; margin: 0 auto 28px; margin-left: 0; margin-right: 0; max-width: 100%; padding: 24px 0 24px; text-align: left; width: 100%"><p style="color: #534236; font-size: 18px; font-style: italic; line-height: 1.8; margin: 0; text-align: left">见字如面。把这一周来不及当面说的话，慢慢写进这一张带细框的暖色信笺里。</p></section><section style="box-sizing: border-box; margin: 28px auto 28px; margin-left: 0; margin-right: 0; padding: 6px 0 12px; width: 100%"><h2 style="color: #534236; font-family: Georgia, &#39;Songti SC&#39;, SimSun, serif; font-size: 22px; font-weight: 700; line-height: 1.5; margin: 0 0 12px; text-align: left; text-indent: 0">给长文一份书信般的温度</h2><p style="background-color: #f5ebdc; color: #534236; line-height: 1.8; margin: 0 12px 20px; padding: 16px 18px; text-align: left">克制的信笺边框收住阅读视线，没有大色块轰炸，读起来像拆开朋友从远方寄来的手写信。</p><section style="margin: 20px auto 20px; padding: 10px 0 10px; width: 84%"><blockquote style="background-color: #f5ebdc; color: #534236; font-size: 18px; line-height: 1.8; margin: 0 12px 0; padding: 12px 18px 12px; text-align: left"><p style="color: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; margin: 0 0 12px">慢一点写，慢一点读，有些心事只有在长信里才说得清。</p></blockquote></section></section><section style="box-sizing: border-box; margin: 28px auto 28px; margin-left: 0; margin-right: 0; padding: 6px 0 12px; width: 100%"><h2 style="color: #534236; font-family: Georgia, &#39;Songti SC&#39;, SimSun, serif; font-size: 22px; font-weight: 700; line-height: 1.5; margin: 0 0 12px; text-align: left; text-indent: 0">收尾留一缕余温</h2><p style="background-color: #f5ebdc; color: #534236; line-height: 1.8; margin: 0 12px 20px; padding: 16px 18px; text-align: left">无论是年终致谢、周更通讯还是生活感悟，这种温润克制的书信体都能拉近和读者的距离。</p><p style="box-sizing: border-box; line-height: 1.8; margin: 20px 0 20px; text-align: left"><img src="../sample-images/rainy-window.jpg" alt="雨天窗边远山与柔和雾气" style="display: block; height: auto; margin: 0; width: 100%"/></p><section style="box-sizing: border-box; margin: 20px 0 0 auto; margin-left: 0; margin-right: 0; padding: 12px 0 0; text-align: right; width: 100%"><p style="color: #534236; line-height: 1.8; margin: 0 0 0; text-align: left">此致，愿你平安顺遂，下封信再叙。</p></section></section></section></section></body></html>
