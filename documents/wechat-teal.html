<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>青绿解读</title><style>*{box-sizing:border-box}body{display:flow-root;width:640px;margin:0;background:#ffffff;color:#222222;font:15px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style></head><body><section data-no-dark="" id="cw-layout-editorial" class="cw-reading-rhythm-v3" style="background-color: #ffffff; box-sizing: border-box; color: #34444b; font-family: -apple-system, BlinkMacSystemFont, &#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif; font-size: 16px; letter-spacing: 0; line-height: 1.92; margin: 0 auto; margin-left: 0; margin-right: 0; max-width: 677px; overflow-wrap: anywhere; padding: 0; padding-left: 24px; padding-right: 24px; text-align: justify; width: 100%; word-break: break-word"><section style="box-sizing: border-box; margin: 0 auto; margin-left: 0; margin-right: 0; max-width: 100%; width: 100%"><p style="color: #34444b; font-size: 16px; line-height: 1.92; margin: 0 0 15px; text-align: justify">干净纯白纸面配清爽连续正文，不堆砌花哨外框，让读者打开就能顺畅进入阅读节奏。</p><p style="box-sizing: border-box; line-height: 1.92; margin: 20px 0 20px; text-align: left"><img src="../sample-images/reading-still-life.jpg" alt="自然光书桌与敞开的笔记本" style="display: block; height: auto; margin: 0; width: 100%"/></p><section style="margin: 24px 0 0"><h2 style="color: #17242b; font-family: -apple-system, BlinkMacSystemFont, &#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif; font-size: 21px; font-weight: 800; line-height: 1.55; margin: 0 0 18px; text-align: left; text-indent: 0"><span class="cw-layout-section-number" style="background-color: #087f8c; color: #ffffff; display: inline-block; font-size: 14px; font-weight: 800; line-height: 1.7; margin-right: 9px; padding: 1px 8px; vertical-align: 3px">01</span>从清晰小节建立阅读节奏</h2></section><p style="line-height: 1.92; margin: 0 0 15px; text-align: justify">左齐青绿 01 数字方标利落醒目，重点句只需克制强调一次，其余交给舒适行距与留白。</p><blockquote style="background-color: #edf7f7; border-left: 1px solid #087f8c; color: #075a63; font-size: 16px; line-height: 1.92; margin: 20px 0 20px; padding: 16px 18px; text-align: justify"><p style="color: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; margin: 0 0 12px">排版的任务，是把内容的逻辑关系清爽地呈现出来。</p></blockquote><section style="margin: 24px 0 0"><h2 style="color: #17242b; font-family: -apple-system, BlinkMacSystemFont, &#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif; font-size: 21px; font-weight: 800; line-height: 1.55; margin: 0 0 18px; text-align: left; text-indent: 0"><span class="cw-layout-section-number" style="background-color: #087f8c; color: #ffffff; display: inline-block; font-size: 14px; font-weight: 800; line-height: 1.7; margin-right: 9px; padding: 1px 8px; vertical-align: 3px">02</span>高频日更号的常备基准款</h2></section><ul style="background-color: #f7f9f8; border-left: 1px solid #087f8c; margin: 0 0 15px; padding: 14px 16px 14px 36px; padding-left: 22px; text-align: left"><li style="margin: 0 0 8px; padding-left: 3px">白底黑字配淡青左线引语，清爽耐看不挑题材</li><li style="margin: 0 0 8px; padding-left: 3px">自动为每个章节生成青绿 01 / 02 数字方标</li><li style="margin: 0 0 8px; padding-left: 3px">适配观点解读、职场攻略、产品公告与深度科普</li></ul><p style="background-color: #edf7f7; border-top: 3px solid #087f8c; color: #34444b; line-height: 1.85; margin: 24px 0 0; padding: 18px 20px; text-align: justify">清爽克制的版式，永远经得起读者反复打开。</p><section class="cw-layout-end-mark" style="line-height: 1.5; padding: 27px 0 8px; text-align: center"><span style="background-color: #e06445; display: inline-block; height: 3px; vertical-align: middle; width: 34px"></span><span style="color: #65767c; display: inline-block; font-size: 12px; line-height: 1.5; margin: 0 10px; vertical-align: middle">END</span><span style="background-color: #087f8c; display: inline-block; height: 3px; vertical-align: middle; width: 34px"></span></section></section></section></body></html>
