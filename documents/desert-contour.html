n: 24px 0; padding: 24px 8px; text-align: right"><p style="color: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; margin: 0 0 12px">出发去旷野，是为了让眼睛重新习惯地平线的辽阔。</p></blockquote></section><section style="background: transparent; border: 0; box-sizing: border-box; margin: 36px 0 0 auto; margin-bottom: 0; margin-left: 0; margin-right: 0; padding: 14px 0; padding-bottom: 0; padding-top: 0; width: 100%"><h2 style="background: transparent; border: 0; color: #8d4e2d; display: block; font-family: Georgia, &#39;Songti SC&#39;, SimSun, serif; font-size: 25px; font-weight: 400; line-height: 1.5; margin: 0 0 16px; padding: 0 0 16px; text-align: left; text-indent: 0; width: auto">地理与游记的排版优势</h2><ul style="margin: 0 0 16px; padding-left: 22px"><li style="margin: 0 0 8px; padding-left: 3px">暖沙大地底纹一眼区分于普通白底模板</li><li style="margin: 0 0 8px; padding-left: 3px">赭红章节色与暖棕正文浑然一体</li><li style="margin: 0 0 8px; padding-left: 3px">配风景、人文和建筑摄影格外高级</li></ul><p style="border: 0; border-top: 1px solid #856342; color: #5b412d; font-size: 16px; line-height: 1.95; margin: 32px 0 0; padding: 18px 0 0; text-align: left">每一道等高线背后，都是一段值得走过的路。</p></section></section></section></body></html>
