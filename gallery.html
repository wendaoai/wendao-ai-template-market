let current=data[0].id;
function select(row){
 current=row.id;document.querySelector('#name').textContent=row.name;
 document.querySelector('iframe').src=row.document+'?v='+encodeURIComponent(row.documentRevision);
 document.querySelector('#document').href=row.document+'?v='+encodeURIComponent(row.documentRevision);
 document.querySelector('#preview').href=row.preview+'?v='+encodeURIComponent(row.previewRevision);
 document.querySelectorAll('button').forEach(button=>button.setAttribute('aria-current',String(button.dataset.id===current)));
}
function list(){
 const query=document.querySelector('#search').value.toLowerCase(),root=document.querySelector('#list');
 root.replaceChildren();
 data.filter(row=>[row.name,row.oldName,row.id,row.slug].join(' ').toLowerCase().includes(query)).forEach(row=>{
  const button=document.createElement('button');button.dataset.id=row.id;
  button.setAttribute('aria-current',String(row.id===current));
  const title=document.createElement('span'),slug=document.createElement('small');
  title.textContent=row.name;slug.textContent=row.slug;button.append(title,slug);
  button.onclick=()=>select(row);root.append(button);
 });
}
document.querySelector('#search').oninput=list;list();select(data[0]);
